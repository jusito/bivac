name: Integration tests - Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration-tests-docker:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: make print-version-env >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.GO_VERSION }}

      - name: Run Docker integration tests
        run: ./test/integration/docker/run_tests.sh

      - name: Upload Docker integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-logs
          path: ./test/integration/docker/logs/
          if-no-files-found: ignore
