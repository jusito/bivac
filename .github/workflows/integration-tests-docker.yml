name: Integration tests - Docker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  integration-tests-docker-raw:
    name: Backup raw data
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: make print-version-env >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.GO_VERSION }}

      - name: Build docker image
        run: docker build --build-arg VERSION=ci --build-arg GO_VERSION="${{ steps.versions.outputs.GO_VERSION }}" --build-arg GOOS=linux --build-arg GOARCH=amd64 --build-arg RCLONE_VERSION="${{ steps.versions.outputs.RCLONE_VERSION }}" --build-arg RESTIC_VERSION="${{ steps.versions.outputs.RESTIC_VERSION }}" -t bivac-testing .

      - name: Run raw data test case
        run: ./tests/raw
        working-directory: ./test/integration/docker/

  integration-tests-docker-mysql:
    name: Backup MySQL database
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: make print-version-env >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.GO_VERSION }}

      - name: Build docker image
        run: docker build --build-arg VERSION=ci --build-arg GO_VERSION="${{ steps.versions.outputs.GO_VERSION }}" --build-arg GOOS=linux --build-arg GOARCH=amd64 --build-arg RCLONE_VERSION="${{ steps.versions.outputs.RCLONE_VERSION }}" --build-arg RESTIC_VERSION="${{ steps.versions.outputs.RESTIC_VERSION }}" -t bivac-testing .

      - name: Run MySQL test case
        run: ./tests/mysql
        working-directory: ./test/integration/docker/

  integration-tests-docker-postgres:
    name: Backup PostgreSQL database
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: make print-version-env >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.GO_VERSION }}

      - name: Build docker image
        run: docker build --build-arg VERSION=ci --build-arg GO_VERSION="${{ steps.versions.outputs.GO_VERSION }}" --build-arg GOOS=linux --build-arg GOARCH=amd64 --build-arg RCLONE_VERSION="${{ steps.versions.outputs.RCLONE_VERSION }}" --build-arg RESTIC_VERSION="${{ steps.versions.outputs.RESTIC_VERSION }}" -t bivac-testing .

      - name: Run PostgreSQL test case
        run: ./tests/postgres
        working-directory: ./test/integration/docker/
